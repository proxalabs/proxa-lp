name: CI

on:
  # PRs only
  pull_request:

# a newer push supersedes the run before it — don't pay for both
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The build prerenders pages from the database, so it needs one. This is a
    # throwaway Postgres for the job; the values below are not secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proxa
          POSTGRES_PASSWORD: proxa
          POSTGRES_DB: proxa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxa -d proxa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://proxa:proxa@localhost:5432/proxa_ci
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      PREVIEW_SECRET: ci-only-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Apply the migrations to the empty database, then build against it.
      - name: Migrate and build
        run: npm run ci

